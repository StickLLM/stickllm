# StickLLM GRUB — splash brand clear; menu in lower band (theme).
set default=0
set timeout=20

insmod part_gpt
insmod part_msdos
insmod iso9660
insmod loopback
insmod fat
insmod ext2
insmod search_fs_file
insmod linux
insmod gzio
if [ "${grub_platform}" = "efi" ]; then
  insmod all_video
  insmod gfxterm
  insmod png
fi

search --no-floppy --set=root --file /.disk/info

# 0.6.1: "insufficient memory, press any key" on some legacy-BIOS / CSM boxes.
# GRUB's heap on BIOS (grub_platform=pc) is small; the gfxterm + unicode font +
# PNG theme load competes with the kernel/initrd buffers. On BIOS use the plain
# text console and leave video mode to the kernel (gfxpayload=text). UEFI keeps
# the themed menu. A "4 Safe boot" entry skips the theme on UEFI too.
if [ "${grub_platform}" = "efi" ]; then
  if loadfont unicode ; then
    set gfxmode=640x480
    set gfxpayload=keep
    terminal_output gfxterm
    # Prefer theme (menu below brand). Fall back to plain background + colors.
    if [ -f /boot/grub/theme.txt ]; then
      set theme=/boot/grub/theme.txt
      export theme
    elif [ -f /boot/grub/splash.png ]; then
      background_image /boot/grub/splash.png
    fi
  fi
else
  set gfxpayload=text
  terminal_output console
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=black/green
set color_normal=light-gray/black
set color_highlight=black/green

menuentry "1 Server / Local" {
    # Chat = on-stick browser when display present + same UI on LAN (pair for remote).
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject live-config.noautologin stickllm.chat console=tty0 loglevel=4 systemd.show_status=false ---
    initrd /live/initrd.img
}

menuentry "2 Terminal" {
    # Admin console + SSH. No Chromium.
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject live-config.noautologin stickllm.ssh console=tty0 loglevel=4 systemd.show_status=false ---
    initrd /live/initrd.img
}

menuentry "3 Test - SSH Enabled" {
    # Server / Local UI + SSH (random password on READY / console).
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject live-config.noautologin stickllm.chat stickllm.ssh console=tty0 loglevel=4 systemd.show_status=false ---
    initrd /live/initrd.img
}

menuentry "4 Safe boot (text menu, IOMMU off)" {
    # 0.6.1: text-only GRUB menu (no theme/font/PNG). Same as 1 otherwise.
    # 0.6.2: amd_iommu=off. AMD-Vi completion-wait timeouts made xhci fail to
    # allocate USB devices (no keyboard/mouse) on the Ryzen test box.
    set gfxpayload=text
    terminal_output console
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject live-config.noautologin stickllm.chat amd_iommu=off console=tty0 loglevel=4 systemd.show_status=false ---
    initrd /live/initrd.img
}

# 0.6.1 (item 15): ISOs staged by `stickllm-update` on STICKLLM-DATA.
# Shown only when a staged ISO exists. Entry 1 always boots the flashed system.
if search --no-floppy --set=updev --file /stickllm-update/next.iso; then
  menuentry "5 Updated system (staged ISO)" {
      search --no-floppy --set=updev --file /stickllm-update/next.iso
      loopback upd ($updev)/stickllm-update/next.iso
      linux (upd)/live/vmlinuz boot=live components ignore_uuid findiso=/stickllm-update/next.iso username=user hostname=stickllm noeject live-config.noautologin stickllm.chat console=tty0 loglevel=4 systemd.show_status=false ---
      initrd (upd)/live/initrd.img
  }
fi
if search --no-floppy --set=prevdev --file /stickllm-update/prev.iso; then
  menuentry "6 Previous update (rollback)" {
      search --no-floppy --set=prevdev --file /stickllm-update/prev.iso
      loopback updp ($prevdev)/stickllm-update/prev.iso
      linux (updp)/live/vmlinuz boot=live components ignore_uuid findiso=/stickllm-update/prev.iso username=user hostname=stickllm noeject live-config.noautologin stickllm.chat console=tty0 loglevel=4 systemd.show_status=false ---
      initrd (updp)/live/initrd.img
  }
fi
