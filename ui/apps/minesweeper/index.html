<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minesweeper — StickLLM</title>
<style>
  body{margin:0;min-height:100vh;background:#0e1214;color:#e4ecee;font:15px/1.4 "Segoe UI",sans-serif;display:grid;justify-items:center;padding:16px}
  a{color:#2bb5a8;text-decoration:none}
  .bar{display:flex;gap:12px;align-items:center;margin:8px 0 12px}
  button.cell{width:32px;height:32px;font:16px/1 "Segoe UI",sans-serif;background:#1e272c;color:#e4ecee;border:1px solid #263136;cursor:pointer;user-select:none;touch-action:manipulation}
  #status.win{color:#2bb5a8;font-weight:700}
  #status.lose{color:#e07a7a;font-weight:700}
  button.cell.open{background:#13181b;cursor:default}
  button.cell.mine{background:#6b2a2a}
  #board{display:grid;grid-template-columns:repeat(9,32px);gap:2px}
</style>
</head>
<body>
<a href="/">StickLLM</a>
<div class="bar"><strong>Minesweeper</strong><span id="status">10 mines</span><button type="button" id="again">New game</button></div>
<div id="board"></div>
<script src="game.js?v=desk2"></script>
</body>
</html>
