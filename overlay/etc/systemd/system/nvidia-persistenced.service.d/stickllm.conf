[Unit]
Description=NVIDIA Persistence Daemon (StickLLM soft)
# Device nodes come from stickllm-nvidia-prep; do not race ahead of modules.
After=stickllm-nvidia.service systemd-modules-load.service
Wants=stickllm-nvidia.service
# Skip cleanly (inactive, not failed) when no GPU nodes — VM / failsafe / no card.
ConditionPathExists=/dev/nvidiactl

[Service]
Restart=on-failure
RestartSec=5
StartLimitIntervalSec=60
StartLimitBurst=3
# Never leave a permanent failed unit that bootstatus screams about.
SuccessExitStatus=0 1
ExecStartPre=-/usr/local/bin/stickllm-nvidia-prep
