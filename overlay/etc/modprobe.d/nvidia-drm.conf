# StickLLM: forcibly disable nvidia-drm KMS/fbdev on ALL boot modes.
# Confirmed: modeset=1/fbdev=1 flashes then "no signal" on AMD+3090 (Local AND Term).
# Newer nvidia-drm may default modeset on — pin modeset=0 so console stays on
# efifb/simpledrm/amdgpu. CUDA/llama use /dev/nvidia* — not DRM KMS.
# STICKLLM_NVIDIA_DRM_NO_MODESET
options nvidia-drm modeset=0 fbdev=0
options nvidia-current-drm modeset=0 fbdev=0
