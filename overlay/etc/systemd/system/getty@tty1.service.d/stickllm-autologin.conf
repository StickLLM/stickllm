# 0.6.1: Terminal mode (GRUB "2 Terminal") boots straight to a shell on tty1.
# getty@tty1 only ever starts in Terminal mode (stickllm-conflict.conf gates it
# on /run/stickllm/allow-getty-tty1, which only bootstatus' Terminal fast path
# creates), so the autologin never applies to the desktop modes.
# Root on the physical console (like a live system's console) instead of the
# 'stickllm' SSH/service user, so no sudo rule for that user is widened.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin root %I $TERM
