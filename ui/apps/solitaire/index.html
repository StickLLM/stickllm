<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solitaire — StickLLM</title>
<style>
  body{margin:0;min-height:100vh;background:#0e1214;color:#e4ecee;font:14px/1.3 "Segoe UI",sans-serif;padding:12px}
  a{color:#2bb5a8;text-decoration:none}
  .top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:flex-start;min-height:120px}
  .pile{min-width:64px;min-height:88px}
  button.card,button.slot{width:64px;height:88px;border-radius:8px;border:1px solid #263136;background:#1e272c;color:#e4ecee;font:16px/1.1 "Segoe UI",sans-serif;cursor:pointer}
  button.card.red{color:#e07a7a}
  button.card.on{outline:2px solid #2bb5a8}
  .stack{display:flex;flex-direction:column}
  .stack button.card{margin-top:-64px}
  .stack button.card:first-child{margin-top:0}
  button.card.down{color:transparent;background:#16332f}
</style>
</head>
<body>
<div class="top"><a href="/">StickLLM</a><strong>Solitaire</strong><span id="msg">Klondike</span><button type="button" id="again">New game</button></div>
<div class="row" id="toprow"></div>
<div class="row" id="tableau"></div>
<script src="game.js?v=desk2"></script>
</body>
</html>
