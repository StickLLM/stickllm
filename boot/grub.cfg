# StickLLM GRUB — splash brand clear; menu in lower band (theme).
set default=0
set timeout=20

insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod ext2
insmod search_fs_file
insmod linux
insmod gzio
insmod all_video
insmod gfxterm
insmod png

search --no-floppy --set=root --file /.disk/info

if loadfont unicode ; then
  set gfxmode=640x480
  set gfxpayload=keep
  terminal_output gfxterm
fi

# Prefer theme (menu below brand). Fall back to plain background + colors.
if [ -f /boot/grub/theme.txt ]; then
  set theme=/boot/grub/theme.txt
  export theme
elif [ -f /boot/grub/splash.png ]; then
  background_image /boot/grub/splash.png
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=black/green
set color_normal=light-gray/black
set color_highlight=black/green

menuentry "1 StickLLM Chat" {
    # Chat = on-stick browser when display present + same UI on LAN (pair for remote).
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject stickllm.chat console=tty0 loglevel=4 systemd.show_status=false ---
    initrd /live/initrd.img
}

menuentry "2 StickLLM Term" {
    # Admin console + SSH. No Chromium.
    linux /live/vmlinuz boot=live components ignore_uuid username=user hostname=stickllm noeject stickllm.ssh console=tty0 loglevel=4 systemd.show_status=false ---
    initrd /live/initrd.img
}

menuentry "3 StickLLM Client (coming soon)" {
    echo "========================================"
    echo "  StickLLM Client — coming in a later release"
    echo "========================================"
    echo "  Boot this USB on a laptop to pair with the"
    echo "  Chat stick — not at the mercy of the host OS"
    echo "  browser. Not implemented in v0.3.1."
    echo ""
    echo "  Press Escape or wait to return to the menu…"
    sleep --interruptible 12
}

menuentry "4 StickLLM Failsafe" {
    linux /live/vmlinuz boot=live components ignore_uuid nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm username=user hostname=stickllm noeject stickllm.ssh console=tty0 systemd.show_status=false ---
    initrd /live/initrd.img
}
