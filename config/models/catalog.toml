[usb_data]
label = "STICKLLM-DATA"
auto_claim_unallocated = true
requires_confirm = true
models_subdir = "models"
vault_subdir = "vault"

[vault]
enabled_by_default = false
requires_explicit_approval = true
wipe_after_failed_unlocks = 0
wipe_after_failed_unlocks_max_allowed = 10
high_risk_recommend = "leave_off"

[host_cache]
enabled_by_default = false
requires_explicit_approval = true
verify_sha256_after_unlock = true
high_risk_recommend = "leave_off"
