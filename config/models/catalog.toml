# StickLLM model catalog — trust anchor when baked into the USB image.
# Downloads may only use these entries; runtime must verify sha256 before load.

version = 1
family = "qwen"

base_image = "lite"
base_model_id = "qwen25-3b-q4km"
base_model_target_id = "qwen25-3b-q4km"
optional_fat_default_id = "qwen38-27b-q4km"
family_policy = "qwen_only"
vision_requires_min_vram_gb = 6

[probe]
enabled = true
countdown_seconds = 30
require_network = true
auto_download_highlighted = true
chat_menu_explicit_only = true
free_space_margin_gb = 1.0
# Only recommend models with hf_repo + hf_files + sha256 pinned
pinned_only = true

[[tier]]
id = "ram_only"
label = "RAM only (no GPU)"
min_vram_gb = 0
series = "qwen2.5"
entries = ["qwen25-3b-q4km"]

[[tier]]
id = "vram_8gb"
label = "8 GB VRAM"
min_vram_gb = 8
series = "qwen2.5"
entries = ["qwen25-7b-q5km", "qwen25-3b-q4km"]

[[tier]]
id = "vram_12gb"
label = "12 GB VRAM"
min_vram_gb = 12
series = "qwen2.5"
entries = ["qwen25-7b-q5km"]

[[tier]]
id = "vram_16gb"
label = "16 GB VRAM"
min_vram_gb = 16
series = "qwen3.8"
entries = ["qwen38-27b-q4km"]

[[tier]]
id = "vram_24gb"
label = "24 GB VRAM (RTX 3090 class)"
min_vram_gb = 24
series = "qwen3.8"
entries = ["qwen38-27b-q4km", "qwen25-7b-q5km"]

