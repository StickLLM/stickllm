# StickLLM: do NOT force nvidia-drm modeset at module load.
# modeset=1 (and especially fbdev=1) takes HDMI CRTCs from efifb/simpledrm/amdgpu
# and leaves the panel at "no signal" if the Local kiosk compositor fails.
# CUDA/llama use nvidia device nodes — DRM KMS is not required for inference.
# STICKLLM_NVIDIA_DRM_NO_MODESET
