<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Office — StickLLM</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#0e1214;color:#e4ecee;font:15px/1.45 "Segoe UI",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #263136}
  header a{color:#2bb5a8;text-decoration:none}
  main{padding:16px;display:grid;gap:12px}
  button,input{font:inherit;background:#1e272c;color:#e4ecee;border:1px solid #263136;border-radius:8px;padding:7px 12px}
  button{cursor:pointer}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  ul{list-style:none;margin:0;padding:0;border:1px solid #263136;border-radius:12px;overflow:hidden}
  li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid #1f292d}
  li:first-child{border-top:0}
  .muted{color:#7d8c91}
  #msg{min-height:1.2em}
  #editorWrap{flex:1;display:none;min-height:0}
  body.editing main{display:none}
  body.editing #editorWrap{display:block}
  #editor{width:100%;height:100%}
  dialog{background:#141b1e;color:#e4ecee;border:1px solid #2bb5a8;border-radius:12px;padding:18px 20px;min-width:360px}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog h3{margin:0 0 10px}
  dialog input{width:100%;box-sizing:border-box;margin:6px 0}
  .row.end{justify-content:flex-end}
  button.primary{background:#2bb5a8;color:#06201d;border-color:#2bb5a8;font-weight:600}
  .err{color:#ff8a80;min-height:1.2em;margin:4px 0}
  li .when{color:#7d8c91;font-size:13px}
  #dlSec{display:grid;gap:8px;margin-top:8px}
</style>
</head>
<body>
<header><a href="/">StickLLM</a><strong>Office</strong><span class="muted">Saved only in vault/Documents</span>
  <button type="button" id="close" hidden>Close document</button></header>
<main>
  <p id="state" class="muted">Checking Office…</p>
  <div class="row">
    <button type="button" data-new="docx">New document</button>
    <button type="button" data-new="xlsx">New spreadsheet</button>
    <button type="button" data-new="pptx">New presentation</button>
    <label class="row">Upload <input type="file" id="upload" accept=".docx,.doc,.odt,.rtf,.txt,.xlsx,.xls,.ods,.csv,.pptx,.ppt,.odp,.pdf" /></label>
  </div>
  <ul id="list"></ul>
  <p id="msg" class="muted" role="status"></p>
  <section id="dlSec">
    <div class="row"><strong>Downloads</strong><span class="muted">vault/Downloads: files the browser saved, newest first</span>
      <button type="button" id="dlRefresh">Refresh</button></div>
    <ul id="downloads"></ul>
  </section>
</main>
<dialog id="nameDlg">
  <form method="dialog" id="nameForm">
    <h3 id="nameTitle">New document</h3>
    <label for="nameInput" class="muted" id="nameLabel">File name</label>
    <input type="text" id="nameInput" maxlength="120" autocomplete="off" spellcheck="false" />
    <p id="nameErr" class="err" role="alert"></p>
    <div class="row end"><button value="cancel" type="button" id="nameCancel">Cancel</button><button value="ok" id="nameOk" class="primary">Create</button></div>
  </form>
</dialog>
<div id="editorWrap"><div id="editor"></div></div>
<script src="docs.js?v=docs2"></script>
</body>
</html>
