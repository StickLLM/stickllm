# StickLLM v0.1 — sole supported hardware profile
# Do not add other GPUs until this profile boots and serves stably.

id = "amd-rtx3090"
name = "AMD desktop + NVIDIA RTX 3090 (24 GB)"
version = "0.1.0"

[host]
cpu_vendor = "amd"
arch = "x86_64"
min_ram_gb = 32
uefi = true
secure_boot = "must_disable"  # proprietary NVIDIA modules are unsigned for this MVP

[gpu]
vendor = "nvidia"
model = "GeForce RTX 3090"
vram_gb = 24
min_driver = "535"
cuda_arch = "sm_86"  # Ampere

[inference]
engine = "llama.cpp"
binary = "/opt/stickllm/bin/llama-server"
host = "0.0.0.0"
port = 8080
ctx_size = 8192
n_gpu_layers = -1  # offload all layers to GPU
threads = 8

[model]
# 0.5.6: the baked base model is the Qwen3.5-4B (chat and the app agent). 3B/7B are downloads.
id = "qwen35-4b-q4km"
filename = "Qwen3.5-4B-Q4_K_M.gguf"
hf_repo = "unsloth/Qwen3.5-4B-GGUF"
hf_files = ["Qwen3.5-4B-Q4_K_M.gguf"]
approx_size_gb = 2.6
sha256 = "25082a7dd3776cc3c741c6347d3bd04523f05796607b3fbc32fa3a25dfa1418c"

[ui]
bind = "0.0.0.0"
port = 80
path = "/opt/stickllm/ui"

[privacy]
default_mode = "ephemeral"
persist_requires_explicit_approval = true
write_internal_disks = false
cloud = false
telemetry = false

[network]
lan_api = true
tls = false  # v0.1: HTTP on trusted LAN only
outbound_required = false
