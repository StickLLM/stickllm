# StickLLM v0.1 — sole supported hardware profile
# Do not add other GPUs until this profile boots and serves stably.

id = "amd-rtx3090"
name = "AMD desktop + NVIDIA RTX 3090 (24 GB)"
version = "0.1.0"

[host]
cpu_vendor = "amd"
arch = "x86_64"
min_ram_gb = 32
uefi = true
secure_boot = "must_disable"  # proprietary NVIDIA modules are unsigned for this MVP

[gpu]
vendor = "nvidia"
model = "GeForce RTX 3090"
vram_gb = 24
min_driver = "535"
cuda_arch = "sm_86"  # Ampere

[inference]
engine = "llama.cpp"
binary = "/opt/stickllm/bin/llama-server"
host = "0.0.0.0"
port = 8080
ctx_size = 8192
n_gpu_layers = -1  # offload all layers to GPU
threads = 8

[model]
# Default: small 3B Q4_K_M (fast first boot). 7B Q5_K_M also baked for upgrade.
id = "qwen25-3b-q4km"
filename = "qwen2.5-3b-instruct-q4_k_m.gguf"
hf_repo = "Qwen/Qwen2.5-3B-Instruct-GGUF"
hf_files = ["qwen2.5-3b-instruct-q4_k_m.gguf"]
approx_size_gb = 2.0
sha256 = "626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d"

[model_also_baked]
id = "qwen25-7b-q5km"
filename = "qwen2.5-7b-instruct-q5_k_m-00001-of-00002.gguf"
hf_repo = "Qwen/Qwen2.5-7B-Instruct-GGUF"
hf_files = [
  "qwen2.5-7b-instruct-q5_k_m-00001-of-00002.gguf",
  "qwen2.5-7b-instruct-q5_k_m-00002-of-00002.gguf",
]
approx_size_gb = 5.1

[ui]
bind = "0.0.0.0"
port = 80
path = "/opt/stickllm/ui"

[privacy]
default_mode = "ephemeral"
persist_requires_explicit_approval = true
write_internal_disks = false
cloud = false
telemetry = false

[network]
lan_api = true
tls = false  # v0.1: HTTP on trusted LAN only
outbound_required = false
