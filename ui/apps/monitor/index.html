<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Monitor — StickLLM</title>
<style>
  :root{--bg:#0e1214;--card:#13181b;--line:#263136;--ink:#e4ecee;--dim:#7d8c91;--accent:#2bb5a8;--green:#3fbf7f;--amber:#e0a030;--red:#e5534b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 "Segoe UI",system-ui,sans-serif}
  body>header{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
  body>header a{color:var(--accent);text-decoration:none}
  .line{margin-left:auto;color:#9fb0b5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Round 2: uniform tiles, every block the size of a GPU tile (4 per row at 1280, 2 at 760). */
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;padding:8px;align-items:stretch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;overflow:hidden;min-height:184px}
  .card .spark{margin-top:auto;padding-top:4px}
  .k-warn{grid-column:1/-1;min-height:0;border-color:var(--amber)}
  .mini{padding:6px 10px}
  .ch{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  h2{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600;flex:1;min-width:0}
  p{margin:2px 0}
  .clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .val{font-size:14px;font-weight:600}
  .dim{color:var(--dim);font-size:12px}
  .sub{margin-top:-2px}
  .state{font-size:12px}
  .state.running{color:var(--green)}.state.loading{color:var(--amber)}.state.stopped{color:var(--dim)}
  .badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}
  .badge.live{background:rgba(43,181,168,.14)}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 3px}
  .ct{min-width:0;flex:1}
  .gauges{display:flex;gap:4px;justify-content:space-around;margin:0 0 3px}
  .gauge{display:flex;flex-direction:column;align-items:center;width:60px}
  .arc{width:60px;height:52px;overflow:visible}
  .arc path{fill:none;stroke-width:5;stroke-linecap:round}
  .arc .track{stroke:var(--line)}
  .gv{font-size:12px;font-weight:600;fill:var(--ink)}
  .gl{font-size:10px;color:var(--dim);margin-top:-6px;text-transform:uppercase;letter-spacing:.05em}
  .fill.t-accent{stroke:var(--accent)}.fill.t-green{stroke:var(--green)}.fill.t-amber{stroke:var(--amber)}.fill.t-red{stroke:var(--red)}
  .gv.t-green{fill:var(--green)}.gv.t-amber{fill:var(--amber)}.gv.t-red{fill:var(--red)}
  .spark{display:flex;align-items:center;gap:6px;margin-top:4px}
  .spark svg{flex:1;height:22px;min-width:0;background:rgba(255,255,255,.02);border-radius:4px}
  .spline{fill:none;stroke:var(--accent);stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sparea{fill:rgba(43,181,168,.16);stroke:none}
  .spcap{font-size:10px;color:var(--dim);white-space:nowrap}
  @media (max-width:540px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><a href="/">StickLLM</a><strong>Monitor</strong><span id="statusLine" class="line"></span></header>
<main id="board"><article class="card"><h2>Status</h2><p>Reading the stick…</p></article></main>
<script src="monitor.js?v=mon059c"></script>
</body>
</html>
