label stickllm
	menu label ^1 StickLLM Server
	menu default
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components ignore_uuid username=user hostname=stickllm noeject console=tty0 loglevel=4 systemd.show_status=false

label stickllm-local
	menu label 2 StickLLM Local
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components ignore_uuid username=user hostname=stickllm noeject stickllm.local console=tty0 loglevel=4 systemd.show_status=false

label stickllm-ssh
	menu label 3 StickLLM Term
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components ignore_uuid username=user hostname=stickllm noeject stickllm.ssh console=tty0 loglevel=4 systemd.show_status=false

label stickllm-failsafe
	menu label 4 StickLLM Failsafe
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components ignore_uuid nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm username=user hostname=stickllm noeject stickllm.ssh console=tty0 systemd.show_status=false
