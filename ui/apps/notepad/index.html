<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notepad — StickLLM</title>
<style>
  body{margin:0;background:#0e1214;color:#e4ecee;font:15px/1.45 "Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #263136}
  header a{color:#2bb5a8;text-decoration:none}
  button,select{font:inherit;background:#1e272c;color:#e4ecee;border:1px solid #263136;border-radius:8px;padding:7px 12px;cursor:pointer}
  .bar{display:flex;gap:8px;align-items:center;padding:10px 16px}
  textarea{flex:1;margin:0 16px 16px;background:#13181b;color:#e4ecee;border:1px solid #263136;border-radius:12px;padding:12px;font:16px/1.45 ui-monospace,monospace;resize:none}
  .muted{color:#7d8c91}
</style>
</head>
<body>
<header><a href="/">StickLLM</a><strong>Notepad</strong><span class="muted" id="where">Plain text</span></header>
<div class="bar">
  <button type="button" id="neu">New</button>
  <button type="button" id="open">Open</button>
  <button type="button" id="save">Save</button>
  <select id="root"><option value="home">Home</option><option value="vault">Vault</option></select>
  <span class="muted" id="msg"></span>
</div>
<textarea id="doc" spellcheck="false" aria-label="Note"></textarea>
<script src="notepad.js?v=desk2"></script>
</body>
</html>
