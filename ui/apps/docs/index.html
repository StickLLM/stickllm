<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Office — StickLLM</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#0e1214;color:#e4ecee;font:15px/1.45 "Segoe UI",sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #263136}
  header a{color:#2bb5a8;text-decoration:none}
  main{padding:16px;display:grid;gap:12px}
  button,input{font:inherit;background:#1e272c;color:#e4ecee;border:1px solid #263136;border-radius:8px;padding:7px 12px}
  button{cursor:pointer}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  ul{list-style:none;margin:0;padding:0;border:1px solid #263136;border-radius:12px;overflow:hidden}
  li{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid #1f292d}
  li:first-child{border-top:0}
  .muted{color:#7d8c91}
  #msg{min-height:1.2em}
  #editorWrap{flex:1;display:none;min-height:0}
  body.editing main{display:none}
  body.editing #editorWrap{display:block}
  #editor{width:100%;height:100%}
</style>
</head>
<body>
<header><a href="/">StickLLM</a><strong>Office</strong><span class="muted">Saved only in vault/Documents</span>
  <button type="button" id="close" hidden>Close document</button></header>
<main>
  <p id="state" class="muted">Checking Office…</p>
  <div class="row">
    <input type="text" id="name" placeholder="Name" maxlength="120" />
    <button type="button" data-new="docx">New document</button>
    <button type="button" data-new="xlsx">New spreadsheet</button>
    <button type="button" data-new="pptx">New presentation</button>
    <label class="row">Upload <input type="file" id="upload" accept=".docx,.doc,.odt,.rtf,.txt,.xlsx,.xls,.ods,.csv,.pptx,.ppt,.odp,.pdf" /></label>
  </div>
  <ul id="list"></ul>
  <p id="msg" class="muted"></p>
</main>
<div id="editorWrap"><div id="editor"></div></div>
<script src="docs.js?v=docs1"></script>
</body>
</html>
